<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Módulo de Compras</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Concepto: tablero de operaciones a gran escala. Tipografía enorme para los números que importan, secciones que
   entran con movimiento y un gráfico que se puede tocar. Cobalto como acento; coral, ámbar y menta solo para estados. */
:root{
  --bg:#F7F8FC; --bg2:#EDF0F8; --surface:#FFFFFF; --ink:#0A0F1E; --ink2:#2C3550; --muted:#667090; --line:#DDE2F0; --line2:#EBEEF7;
  --accent:#2B50FF; --accent2:#00B8D9; --accent-soft:#E6EBFF; --on-accent:#FFFFFF;
  --crit:#F0402E; --crit-soft:#FFE7E3; --warn:#B76E00; --warn-soft:#FFF0CF; --ok:#0F9F63; --ok-soft:#DDF6EA;
  --c1:#2B50FF; --c2:#F0402E; --c3:#0F9F63; --c4:#E59A00; --c5:#8A4DFF; --c6:#00B8D9; --c7:#D6409F; --c8:#FF7A45; --c9:#5E8C61; --c10:#35507A;
  --shadow:0 1px 2px rgba(10,15,30,.06),0 16px 40px -12px rgba(10,15,30,.18);
  --f-head:'Bricolage Grotesque','Instrument Sans',system-ui,sans-serif;
  --f-body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
.app{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:0 80px;max-width:1560px;margin:0 auto}
h1,h2,h3,h4{font-family:var(--f-head);margin:0;letter-spacing:-.02em;text-wrap:balance;line-height:1.05}
h1{font-weight:800;font-size:clamp(34px,6vw,68px)}
h2{font-weight:700;font-size:clamp(26px,3.6vw,40px)}
h3{font-weight:700;font-size:22px}
h4{font-weight:700;font-size:17px;letter-spacing:-.01em}
p{margin:0 0 .6em}
.mono,td.n,th.n,.big{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
a{color:var(--accent)}
/* barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding-top:14px;padding-bottom:12px;display:flex;flex-direction:column;gap:12px}
.brand{display:flex;gap:12px 24px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.logo{font-family:var(--f-head);font-weight:800;font-size:26px;letter-spacing:-.03em}
.logo i{font-style:normal;color:var(--accent)}
.status{display:flex;gap:8px;flex-wrap:wrap;font-size:13.5px}
.pill{display:inline-flex;gap:6px;align-items:center;border-radius:999px;padding:4px 12px;background:var(--bg2);color:var(--ink2);font-weight:500;white-space:nowrap}
.pill b{color:var(--ink);font-weight:600}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.nav{position:relative;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;background:var(--bg2);border-radius:999px;padding:5px;width:fit-content;max-width:100%}
.nav::-webkit-scrollbar{display:none}
.nav .ind{position:absolute;top:5px;bottom:5px;left:0;border-radius:999px;background:var(--ink);transition:transform .45s var(--ease),width .45s var(--ease);z-index:0}
.tab{position:relative;z-index:1;border:0;background:transparent;padding:9px 18px;border-radius:999px;font-weight:600;font-size:15px;color:var(--ink2);white-space:nowrap;transition:color .3s}
.tab[aria-selected="true"]{color:var(--bg)}
.tab:not([aria-selected="true"]):hover{color:var(--accent)}
/* contenido */
.panel{padding-top:26px;display:flex;flex-direction:column;gap:30px}
.rise{animation:rise .6s var(--ease) both;animation-delay:calc(var(--i,0)*70ms)}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.eyebrow{font-size:12.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
.lead{font-size:clamp(17px,2vw,21px);color:var(--ink2);max-width:62ch}
.bar{display:flex;gap:12px 16px;flex-wrap:wrap;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>label,.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
select,input[type=text],input[type=number],input[type=date],textarea{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 13px;min-width:0;transition:border-color .2s,box-shadow .2s}
select:hover,input:hover,textarea:hover{border-color:var(--muted)}
select:focus,input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);outline:none}
input[type=number]{width:96px;font-family:var(--f-mono);font-size:14.5px;text-align:right}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 20px;font-weight:600;transition:transform .2s var(--ease),border-color .2s,background .2s,color .2s}
.btn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.1);color:var(--on-accent)}
.btn.sm{padding:5px 13px;font-size:13.5px}
.btn[disabled]{opacity:.45;pointer-events:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:24px;min-width:0}
.card.flat{background:var(--bg2);border-color:transparent}
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:end}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .v{font-family:var(--f-head);font-weight:800;font-size:clamp(46px,7vw,92px);line-height:.95;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.stat .l{font-size:14px;color:var(--muted);font-weight:500}
.stat.crit .v{color:var(--crit)}.stat.acc .v{color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:22px 28px}
.stats.s .v{font-size:clamp(34px,4vw,54px)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.pcard{position:relative;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:14px;overflow:hidden;transition:transform .35s var(--ease),box-shadow .35s var(--ease),border-color .25s}
.pcard:hover{transform:translateY(-5px);box-shadow:var(--shadow);border-color:var(--accent)}
.pcard .nm{font-family:var(--f-head);font-weight:800;font-size:26px;letter-spacing:-.03em}
.pcard .big{font-size:44px;font-weight:500;line-height:1}
.meter{height:10px;border-radius:99px;background:var(--bg2);overflow:hidden;display:flex}
.meter>i{display:block;height:100%;transform-origin:left;animation:grow .9s var(--ease) both}
.chip{display:inline-flex;align-items:center;border-radius:999px;padding:3px 11px;font-size:13px;font-weight:600;background:var(--bg2);color:var(--ink2);white-space:nowrap}
.chip.crit{background:var(--crit-soft);color:var(--crit)}.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.acc{background:var(--accent-soft);color:var(--accent)}
.muted{color:var(--muted)}.small{font-size:14px}.xs{font-size:12.5px}
/* tablas */
.tw{overflow:auto;border-radius:22px;border:1px solid var(--line);background:var(--surface);max-height:74vh}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:15.5px}
th{position:sticky;top:0;z-index:2;background:var(--surface);text-align:left;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:14px 16px;border-bottom:1.5px solid var(--line);white-space:nowrap}
td{padding:14px 16px;border-bottom:1px solid var(--line2);white-space:nowrap;vertical-align:middle}
td.wrap,th.wrap{white-space:normal}
th.n,td.n{text-align:right;font-size:15px}
tr.row{cursor:pointer;transition:background .2s}
tr.row:hover td{background:var(--accent-soft)}
tbody tr.rise{animation-delay:calc(var(--i,0)*18ms)}
.pn{font-weight:600;font-size:16px}
.pn small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
input.ed{width:84px;padding:7px 10px;border-radius:10px}
.cov{position:relative;height:10px;border-radius:99px;background:var(--bg2);min-width:150px;overflow:visible}
.cov>i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;transform-origin:left;animation:grow .8s var(--ease) both}
.cov>b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.55}
.ctr{display:flex;gap:10px;align-items:center}
/* gráficos */
.chart{position:relative;width:100%;min-width:0;user-select:none;touch-action:pan-y}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .hit{cursor:crosshair}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:14px;padding:9px 13px;font-size:13.5px;z-index:5;white-space:nowrap;box-shadow:var(--shadow)}
.tip b{font-family:var(--f-head);font-size:15px}
.sw{width:16px;height:4px;border-radius:2px;display:inline-block;vertical-align:middle}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;margin-top:10px}
.legend button{display:inline-flex;gap:8px;align-items:center;border:0;background:none;padding:3px 0;color:var(--ink2);font-weight:500}
.legend button.off{opacity:.35}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipb{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:500;display:inline-flex;gap:8px;align-items:center;transition:all .2s var(--ease)}
.chipb:hover{border-color:var(--accent)}
.chipb[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.seg{display:inline-flex;background:var(--bg2);border-radius:999px;padding:4px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:7px 16px;font-weight:600;font-size:14.5px;color:var(--ink2);transition:all .25s var(--ease)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.delta{position:absolute;z-index:6;transform:translate(-50%,-100%);background:var(--ink);color:var(--bg);border-radius:18px;padding:10px 18px;text-align:center;box-shadow:var(--shadow);animation:pop .3s var(--ease) both;pointer-events:none}
.delta .p{font-family:var(--f-head);font-weight:800;font-size:34px;line-height:1;letter-spacing:-.03em}
.delta .p.up{color:var(--c3)}.delta .p.dn{color:var(--crit)}
.delta .s{font-size:12.5px;opacity:.8;margin-top:3px}
.insp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
.drop{border:2px dashed var(--line);border-radius:18px;padding:22px;text-align:center;color:var(--muted);background:var(--bg2);transition:all .25s var(--ease)}
.drop.over{border-color:var(--accent);background:var(--accent-soft);transform:scale(1.01)}
textarea{width:100%;min-height:84px;font-family:var(--f-mono);font-size:13px}
.note{border-radius:16px;background:var(--accent-soft);padding:14px 18px;font-size:15px}
.note.warn{background:var(--warn-soft)}.note.crit{background:var(--crit-soft)}
.drawer-bg{position:fixed;inset:0;background:rgba(5,8,18,.5);backdrop-filter:blur(3px);z-index:70;display:flex;justify-content:flex-end;animation:fade .3s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slide{from{transform:translateX(60px);opacity:0}to{transform:none;opacity:1}}
.drawer{background:var(--bg);width:min(1000px,100%);height:100%;overflow:auto;padding:26px max(22px,env(safe-area-inset-right,0px)) 60px 26px;display:flex;flex-direction:column;gap:22px;animation:slide .45s var(--ease) both}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:18px}
.steps li{display:grid;grid-template-columns:38px 1fr;gap:14px}
.steps .b{width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:15px;font-weight:700;font-family:var(--f-head)}
.mono-s{font-family:var(--f-mono);font-size:14px}
.toast{position:fixed;bottom:max(18px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 22px;border-radius:999px;z-index:90;font-size:15px;font-weight:500;max-width:90vw;animation:pop .3s var(--ease) both;box-shadow:var(--shadow)}
.pbar{height:8px;background:var(--bg2);border-radius:99px;overflow:hidden}.pbar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.flex{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.sp{flex:1}
ul.plain,ol.plain{margin:6px 0 0;padding-left:22px}ul.plain li,ol.plain li{margin:6px 0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:20px}
.sec-h{display:flex;align-items:baseline;gap:14px 20px;flex-wrap:wrap;justify-content:space-between}
/* orden de compra */
.po-head{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:end}
.po-titulo{min-width:0}
.po-estado{margin-top:10px;max-width:520px;line-height:1.5}
.po-meta{display:grid;grid-template-columns:repeat(3,minmax(120px,1fr));gap:10px}
.po-params{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:16px;margin:22px 0 4px}
.po-grupo{border:1px solid var(--line,rgba(120,130,160,.22));border-radius:18px;padding:16px 18px;background:rgba(120,130,160,.04);min-width:0}
.po-gt{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;margin-bottom:14px}
.po-gt .n{display:inline-grid;place-items:center;flex:none;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:13px;font-weight:700}
.po-fila{display:flex;flex-wrap:wrap;gap:14px 16px;align-items:flex-end}
.po-fila input{width:110px}
.po-fila input[type=date]{width:172px}
.po-fila .dato .v{min-height:40px;display:flex;align-items:center;padding:0 14px;border-radius:12px;background:rgba(120,130,160,.12);font-weight:700;white-space:nowrap}
.po-nota{margin-top:12px;font-size:13px;line-height:1.45;max-width:560px}
.tag-l{display:flex;flex-direction:column;gap:2px;padding:12px 18px;border-radius:18px;background:var(--bg2);min-width:130px}
.tag-l .k{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.tag-l .v{font-family:var(--f-head);font-weight:800;font-size:28px;letter-spacing:-.03em}
/* teoría */
.theory{display:grid;grid-template-columns:230px minmax(0,1fr);gap:40px;align-items:start}
.toc{position:sticky;top:160px;display:flex;flex-direction:column;gap:4px}
.toc a{text-decoration:none;color:var(--ink2);padding:7px 14px;border-radius:12px;font-weight:500;font-size:15px;transition:background .2s,color .2s}
.toc a:hover{background:var(--accent-soft);color:var(--accent)}
.tsec{display:flex;flex-direction:column;gap:14px;scroll-margin-top:170px;padding-bottom:36px}
.tsec>p,.tsec li{max-width:74ch}
.formula{font-family:var(--f-mono);font-size:15px;background:var(--bg2);border-radius:16px;padding:16px 20px;overflow-x:auto;white-space:pre;line-height:1.7}
.formula b{color:var(--accent)}
.kv{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:10px 22px;font-size:15.5px}
.kv dt{font-weight:700;font-family:var(--f-head);font-size:17px}.kv dd{margin:0;color:var(--ink2)}
@media (max-width:900px){.po-params{grid-template-columns:1fr}.hero,.po-head,.insp,.theory{grid-template-columns:1fr}.toc{position:static;flex-direction:row;flex-wrap:wrap}.kv{grid-template-columns:1fr}}
@media (max-width:640px){.po-meta{grid-template-columns:repeat(2,minmax(0,1fr))}.po-fila input[type=date]{width:100%}.card{padding:18px;border-radius:18px}.tab{padding:8px 14px;font-size:14px}th,td{padding:12px 12px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}html{scroll-behavior:auto}}

/* ---- agregados v2 ---- */
.po-t table{font-size:14.5px}
.po-t th,.po-t td{padding:11px 8px}
.po-t th{white-space:normal;line-height:1.15;vertical-align:bottom;font-size:11.5px}
.po-t td.n{font-size:14px;font-weight:500;vertical-align:middle;font-family:var(--f-body);white-space:nowrap}
.po-t th.n{font-family:var(--f-body);letter-spacing:0;text-transform:none;font-size:12px;font-weight:600}
.po-t th .t{display:block;font-size:12.5px;font-weight:700;color:var(--ink)}
.po-t th .r{display:block;font-size:10.5px;font-weight:500;color:var(--muted);margin-top:2px;line-height:1.2}
.po-t th,.po-t td{border-left:1px solid var(--line,rgba(120,130,160,.18))}
.po-t th:first-child,.po-t td:first-child{border-left:0}
.po-t th.ed,.po-t td.ed{background:rgba(46,91,255,.06)}
.po-t th[title]{cursor:help}
.po-t .calc{color:var(--accent);font-size:12px;font-weight:600;margin-left:4px;cursor:pointer}
.po-t th{border-top:0!important}
.po-t th .g{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;opacity:.7;margin-bottom:2px}
.po-t td.n b,.po-t .sup .num{font-size:14px;font-weight:700;font-family:var(--f-body)}
.po-t .pn{font-size:14px;font-weight:600}
.po-t .sub{font-size:11.5px;margin-top:2px}
.po-t .u{font-size:11.5px}
.po-t td.sticky1{vertical-align:middle}
.po-t .sup{min-width:110px}.po-t .sup .cov{width:110px}
.po-t .sticky1{min-width:220px;max-width:260px}
.po-t input.ed{width:70px;padding:6px 8px}
.po-t .sup{min-width:120px}.po-t .sup .cov{width:120px}
.po-t .pn small{white-space:normal}
.hero .stat .v{font-size:clamp(34px,4.4vw,62px)}
.hero{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.hero .stats{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.pname{max-width:320px;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.sticky1{position:sticky;left:0;z-index:1;background:var(--surface)}th.sticky1{z-index:3}
th .g{display:block;font-size:10.5px;letter-spacing:.14em;color:var(--accent);margin-bottom:3px}
th.g1{border-top:4px solid var(--c6)}th.g2{border-top:4px solid var(--c4)}th.g3{border-top:4px solid var(--accent)}th.g4{border-top:4px solid var(--ok)}
.sub{display:block;font-size:12px;color:var(--muted);font-weight:400;font-family:var(--f-body);white-space:nowrap}
.u{font-size:12px;color:var(--muted);margin-left:4px;font-family:var(--f-body)}
.sup{display:flex;flex-direction:column;gap:6px;min-width:140px;align-items:flex-end}
.sup .num{font-family:var(--f-mono);font-weight:600;font-size:17px}
.sup .cov{width:140px;min-width:0}
.provrow{display:flex;gap:10px;flex-wrap:wrap}
.pp-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0 4px;position:relative;z-index:30}   /* por encima de los bloques de abajo: si no, el desplegable queda tapado */
.pp{position:relative;min-width:0;max-width:100%}
.pp-btn{display:inline-flex;align-items:center;gap:10px;min-width:min(420px,100%);max-width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 16px;font-weight:700;font-size:16px;text-align:left;transition:border-color .2s,box-shadow .2s}
.pp-btn:hover{border-color:var(--accent)}

<script>
'use strict';
/* ================= utilidades ================= */
const DAY = 86400000;
const dnFromYMD = (y, m, d) => Math.round(Date.UTC(y, m - 1, d) / DAY);
const strToDn = s => { const [y, m, d] = String(s).slice(0, 10).split('-').map(Number); return dnFromYMD(y, m, d); };
const dnToStr = n => new Date(n * DAY).toISOString().slice(0, 10);
const dnFmt = n => { const s = dnToStr(n); return s.slice(8) + '/' + s.slice(5, 7) + '/' + s.slice(2, 4); };
const dnFmtS = n => { const s = dnToStr(n); return s.slice(8) + '/' + s.slice(5, 7); };
const dowOf = n => (((n + 3) % 7) + 7) % 7; // 0 = lunes
const todayDn = () => { const d = new Date(); return dnFromYMD(d.getFullYear(), d.getMonth() + 1, d.getDate()); };
const DOWN = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const sdev = a => { if (a.length < 2) return 0; const m = mean(a); return Math.sqrt(a.reduce((s, x) => s + (x - m) ** 2, 0) / (a.length - 1)); };
const nf = (x, d = 0) => (x == null || !isFinite(x)) ? '—' : x.toLocaleString('es-AR', { minimumFractionDigits: d, maximumFractionDigits: d });
const nfs = (x, d = 1) => { if (x == null || !isFinite(x)) return '—'; return (x > 0 ? '+' : '') + nf(x, d); };

const normKey = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
const normCod = s => String(s ?? '').trim().replace(/\.0+$/, '').replace(/^0+(?=\d)/, '');
const normSuc = s => String(s ?? '').trim().replace(/\s+/g, ' ').replace(/^SUC\s+/i, '');
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
function toast(msg, ms = 3500) { const t = $('#toast'); t.innerHTML = '<div class="toast">' + esc(msg) + '</div>'; clearTimeout(toast._t); toast._t = setTimeout(() => t.innerHTML = '', ms); }
function toNum(v) {

  if (v == null) return NaN;

  const c = s.lastIndexOf(','), p = s.lastIndexOf('.');

}
function numIn(s) { const m = String(s ?? '').match(/\d[\d.,]*/); return m ? toNum(m[0]) : NaN; }
function parseDateAny(v) {

}
function parseDelimited(text) {

  const cands = ['\t', ';', ','];

/* ================= estado ================= */
const S = {
  ready: false, db: null, master: [], mm: {}, params: null, meta: null, vd: {}, dd: {}, orders: [], notes: {}, stock: null,
  stockMap: {}, stockDn: 0, cache: {}, plan: [], planBy: {},
  ui: { tab: 'plan', prov: '', q: '', estado: '', vista: 'compra', sort: { k: 'estado', dir: 1 }, tPick: { kind: 'all', val: '' }, tMode: 'total', tUnit: 'u', tRange: 52, tLY: true, tStores: null, tOffStores: new Set(), pHorizon: 12, pShow: 'fc', detail: null }
};
const DEFAULT_G = { N: 4, pesos: 'lineal', parcial: true, admin: false, estac: 0.5, estacMin: 0.5, estacMax: 2.5, tend: 0, clip: 2.5, z: 1.65, maxCob: 90, redondeo: 'techo', tol: 0.15, ltCorto: 3, ltMedio: 10, recConf: { confiable: 0, aveces: 3, seguido: 7 } };

const CONF_LABEL = { confiable: 'Confiable', aveces: 'Falla a veces', seguido: 'Falla seguido' };

function invalidate() { S.cache = {}; S.plan = []; S.planBy = {}; }
function setup() {
  const m = S.meta;

}
function computeDow() {

  for (const c in S.dd) for (const s in S.dd[c]) { if (s === 'ADMINISTRACION') continue; const a = S.dd[c][s]; for (let w = S.vf; w <= cl; w++) for (let k = 0; k < 7; k++) { const v = a[w * 7 + k] || 0; acc[k] += v; t += v; } }

  const st = S.stock; S.stockDn = st && st.date ? strToDn(st.date) : todayDn();
  if (!st) return;
  const seen = new Set();
  for (const r of st.rows || []) {
    const m = S.mm[normCod(r.cod)];
    if (!m) { S.stockUnknown.push(r.cod); continue; }
    seen.add(m.cod);
    const u = String(r.unit || '').toLowerCase();
    let f = 1;
    if (u.startsWith('caj')) f = m.ucaja || 1; else if (u.startsWith('kg') || u.startsWith('kil')) f = m.kgu ? 1 / m.kgu : 1;

/* ================= series y pronóstico ================= */
const rawMult = m => (m.uni === 'KG' && m.kgu) ? 1 / m.kgu : 1;               // export → unidades de venta

const unitMult = (m, u) => u === 'compra' ? 1 / pmOf(m) : u === 'kg' ? (m.kgu || 1) : 1; // unidades de venta → vista

/* ================= Orden de compra ================= */
const dnLong = n => DOWN[dowOf(n)] + ' ' + dnFmtS(n);
function lineCalc(r) {

/* gráfico: stock teórico desde el día del pedido */
function stockSeries(r) {

  // El stock solo baja cuando sale un envío (cada uno se lleva "frecuencia" días de venta); al llegar el proveedor sube el pedido.
  const salidas = [];
  for (let j = 0; j < r.nPre; j++) { const dn = Math.round(r.envDn + j * r.frec); salidas.push({ dn, u: demand(cod, dn, r.frec) }); }
  for (let j = 0; r.N - j * r.frec > 1e-9; j++) { const dn = Math.round(r.startPost + j * r.frec); salidas.push({ dn, u: demand(cod, dn, Math.min(r.frec, r.N - j * r.frec)) }); }

  for (let k = 0; k <= K; k++) {
    const d = r.pedDn + k, antesB = base, antesC = con;
    for (const s of salidas) if (s.dn === d) { base = Math.max(0, base - s.u); con = Math.max(0, con - s.u); }   // el envío de ese día sale con el stock que ya había
    noOrd.push([k, antesB]); pts.push([k, antesC]);
    if (base !== antesB) noOrd.push([k, base]);
    if (con !== antesC) pts.push([k, con]);
    if (d === r.arrDn && ord > 0) { con += ord; pts.push([k, con]); }          // llega el proveedor: recién ahí suma el pedido
  }
  return { pts, noOrd, K };
}

  const sf = []; for (let k = 1; k <= 8; k++) sf.push(seasFactor(m.cod, S.lastIdx + k));
  const n13 = Math.max(0, Math.min(13, P.usableLast - P.start + 1)), sq = Math.sqrt(Math.max(r.H, 1) / 7);
  const wkTbl = P.idx.map((i, k) => `<tr><td>${dnFmt(wk(i))}</td><td class="n">${nf(P.raw[i], 1)}</td><td class="n">${nf(P.y[i], 1)}${P.useP && i === S.lastIdx ? ' <span class="chip warn" title="Semana parcial completada con el perfil por día">extrapolada</span>' : ''}</td><td class="n">${nf(P.ya[k], 1)}${P.clipped[k] ? ' <span class="chip crit" title="Recortada al tope de semanas atípicas">tope</span>' : ''}</td><td class="n">${P.w[k]}</td></tr>`).join('');
  return `<ol class="steps">
    <li><span class="b">1</span><div><b>Nivel actual de ventas.</b> Promedio ponderado de las últimas ${P.nUse} semanas (${g.pesos === 'lineal' ? 'las más recientes pesan más' : 'mismo peso'}${g.parcial ? '; la semana en curso se completa con el perfil por día' : ''}) = <b class="mono">${nf(P.L, 1)} u./sem</b>.
      ${withWeeks ? `<div class="tw" style="margin-top:8px;max-height:none"><table><thead><tr><th>Semana</th><th class="n">Vendido</th><th class="n">Equivalente semana</th><th class="n">Usado</th><th class="n">Peso</th></tr></thead><tbody>${wkTbl || '<tr><td colspan="5" class="muted">Sin historia</td></tr>'}</tbody></table></div>` : ''}
      <div class="muted small" style="margin-top:4px">Tope de semanas atípicas: ${g.clip > 0 ? nf(g.clip, 1) + ' × la mediana de 13 semanas (' + nf(P.med, 1) + ') = ' + (isFinite(P.cap) ? nf(P.cap, 1) : 'no aplica') : 'desactivado'}.</div></div></li>
    <li><span class="b">2</span><div><b>Estacionalidad.</b> Modo: <b>${mode === 'grupo' ? 'grupo "' + esc(m.grupo) + '"' : mode === 'producto' ? 'propia del producto' : 'ninguna'}</b>, intensidad ${nf(g.estac * 100)}%. Factor de las próximas 8 semanas: <span class="mono">${sf.map(x => nf(x, 2)).join(' · ')}</span>. Compara las ventas de este mismo período del año pasado contra las de las semanas que hoy usamos como nivel.</div></li>
    <li><span class="b">3</span><div><b>Fechas y envíos.</b> Pedido el <b>${dnLong(r.pedDn)}</b>. El primer envío a sucursales es ${r.denv} días después: <b>${dnLong(r.envDn)}</b>; hasta ese día el stock no se consume. Después sale un envío cada <b>${nf(r.frec, r.frec % 1 ? 1 : 0)}</b> días y cada uno se lleva ${nf(r.frec, r.frec % 1 ? 1 : 0)} días de venta. El proveedor tarda ${r.LT} días: llega el <b>${dnLong(r.arrDn)}</b>. ${r.nPre === 0 ? 'Ningún envío sale hasta el día de la llegada.' : `Hasta el día que llega (inclusive) salen <b>${r.nPre}</b> ${r.nPre === 1 ? 'envío' : 'envíos'}: ${nf(r.nPre, 0)} × ${nf(r.frec, r.frec % 1 ? 1 : 0)} = <b>${nf(r.diasPre, 0)} días</b> de venta que salen del stock actual (la mercadería que llega ese día todavía no cuenta para ese envío).`}</div></li>
    <li><span class="b">4</span><div><b>Pronóstico desde la llegada.</b> Envíos a cubrir: <b>${nf(r.nEnv, 1)}</b>. Días a cubrir: <b>${nf(r.N, 0)}</b>${r.nManual ? ' (elegidos a mano)' : ` = ${nf(r.nEnv, 1)} × ${r.frec}`}, empezando con el primer envío que sale después de la llegada: del ${dnFmt(r.startPost)} al ${dnFmt(r.startPost + r.N - 1)}. Venta pronosticada: <b class="mono">${nf(r.D_N, 1)} u.</b> (${nf(r.D_N / r.pm, 1)} ${ul}), unas ${nf(r.daily, 2)} u./día.</div></li>
    <li><span class="b">5</span><div><b>Stock al llegar.</b> Stock actual <span class="mono">${nf(r.pos, 1)} u.</span>. Los ${nf(r.nPre, 0)} ${r.nPre === 1 ? 'envío' : 'envíos'} que salen hasta la llegada (${nf(r.diasPre, 0)} días de venta) se llevan <span class="mono">${nf(r.D_LT, 1)} u.</span> Llegás con <b class="mono">${nf(r.stockArr, 1)} u.</b>${r.falta > 1e-9 ? ` (te faltan ${nf(r.falta, 1)} u.: te quedás sin mercadería antes de que llegue)` : ''}.</div></li>
    <li><span class="b">6</span><div><b>Stock de seguridad.</b> ${nf(r.ssDias, 1)} días${r.ssManual ? ' (definidos a mano)' : ` = ${pr.ss} del proveedor + ${g.recConf[pr.conf]} por confiabilidad (${CONF_LABEL[pr.conf]})`} × ${nf(r.daily, 2)} u./día = <b class="mono">${nf(r.SSu, 1)} u.</b> (${nf(r.SSu / r.pm, 1)} ${ul}). Referencia estadística: con las últimas ${n13} semanas, σ = ${nf(P.sd13, 1)} y CV = ${nf(P.cv * 100)}%, z × σ × √(${nf(r.H, 0)}/7) = ${g.z} × ${nf(P.sd13, 1)} × ${nf(sq, 2)} = ${nf(g.z * P.sd13 * sq, 1)} u. ÷ ${nf(r.daily, 2)} u./día = <b class="mono">${nf(r.sugDays, 1)} días</b>.</div></li>
    <li><span class="b">7</span><div><b>Pedido.</b> Lo que falta vender después de que llega (${nf(r.Dafter, 1)} u.) + seguridad (${nf(r.SSu, 1)} u.) = objetivo <span class="mono">${nf(r.target, 1)} u.</span> Menos el stock al llegar (${nf(r.stockArr, 1)} u.) = <span class="mono">${nf(r.need, 1)} u.</span> = ${nf(r.needPU, 2)} ${ul} → sugerido <b>${nf(r.sug)} ${ul}</b> (${g.redondeo === 'techo' ? 'redondeo hacia arriba con tolerancia de ' + nf(g.tol * 100) + '%' : 'redondeo al más cercano'}).</div></li>
  </ol>`;
}

/* ================= detalle de producto ================= */
function openDetail(cod) { S.ui.detail = cod; S.ui.dsel = { a: null, b: null }; drawDetail(); }
function closeDetail() { S.ui.detail = null; $('#overlay').innerHTML = ''; document.body.style.overflow = ''; }

  const nextW = []; for (let k = 1; k <= 12; k++) { const t = S.lastIdx + k; nextW.push({ t, f: weekF(cod, t), s: seasFactor(cod, t) }); }
  const mode = (S.params.prod[cod] || {}).est || 'grupo', e = ESTADO[r.estado], u = S.ui, c = lineCalc(r);

    ${P.newish ? '<div class="note warn small">Producto con menos de 8 semanas de historia: el pronóstico es poco confiable.</div>' : ''}
    <div class="stats s"><div class="stat"><div class="v">${nf(r.wk4, 1)}</div><div class="l">u. de venta por semana pronosticadas</div></div><div class="stat"><div class="v">${nf(r.pos / r.pm, 1)}</div><div class="l">${ul} de stock</div></div><div class="stat"><div class="v">${r.cover >= 400 ? '>365' : nf(r.cover, 0)}</div><div class="l">días de cobertura</div></div><div class="stat acc"><div class="v">${nf(r.sug)}</div><div class="l">${ul} sugeridas (${nf(c.kg, 0)} kg)</div></div></div>

  const ps = [...new Set(S.master.map(p => p.prov))].sort(), pickVal = u.tPick.kind === 'all' ? 'all' : u.tPick.kind + ':' + u.tPick.val;
  if (!u.tStores) u.tStores = S.storeList.slice(0, 6);

  const a4 = avg(sm, cl - 3, cl), a13 = avg(sm, cl - 12, cl), p4 = avg(sm, cl - 7, cl - 4), ly4 = (cl - 55 >= S.vf) ? avg(sm, cl - 55, cl - 52) : null;
  const w13 = Array.from(sm.slice(Math.max(S.vf, cl - 12), cl + 1));
  let slope = null; if (w13.length >= 6) { const n = w13.length, mu = mean(w13), xm = (n - 1) / 2; let sxy = 0, sxx = 0; w13.forEach((v, i) => { sxy += (i - xm) * (v - mu); sxx += (i - xm) ** 2; }); slope = mu > 0 ? sxy / sxx / mu : null; }
  const dChip = v => v == null ? '<span class="muted">sin dato</span>' : `<span class="chip ${v > .05 ? 'ok' : v < -.05 ? 'crit' : ''}">${pct(v, 1)}</span>`;
  const stRows = S.storeList.map(s => { const d = seriesFor(cods, { unit, store: s }), s4 = avg(d, cl - 3, cl), s13 = avg(d, cl - 12, cl), sp = avg(d, cl - 7, cl - 4), sl = cl - 55 >= S.vf ? avg(d, cl - 55, cl - 52) : null; let lastW = -1; for (let k = cl; k >= S.vf; k--) if (d[k] > 0) { lastW = k; break; } return { s, s4, s13, sp, sl, lastW }; });

    <div class="stats"><div class="stat"><div class="v">${nfu(a4)}</div><div class="l">${esc(unitName)} por semana (últimas 4)</div></div><div class="stat"><div class="v ${p4 > 0 ? (a4 >= p4 ? 'pct-up' : 'pct-dn') : ''}">${p4 > 0 ? pctTxt(a4 / p4 - 1, 0) : '—'}</div><div class="l">vs las 4 semanas previas</div></div><div class="stat"><div class="v ${ly4 ? (a4 >= ly4 ? 'pct-up' : 'pct-dn') : ''}">${ly4 ? pctTxt(a4 / ly4 - 1, 0) : '—'}</div><div class="l">vs el año anterior</div></div></div></section>

    </tbody></table></div></section>
  <section class="card"><div class="flex"><h3>Datos semana a semana</h3><span class="sp"></span><button class="btn sm" id="tExp">Exportar tabla</button></div>

function mergeParsed(list) {
  if (list.length === 1) { const q = list[0]; return { ...q, rangosNuevos: [[q.minD, q.maxD]] }; }
  const agg = new Map(), ignored = new Map(), dayTot = new Map(), fams = new Set(); let minD = Infinity, maxD = -Infinity, n = 0, bad = 0, truncado = false, matriz = false;
  for (const q of list) {
    for (const [cod, stores] of q.agg) { let a = agg.get(cod); if (!a) agg.set(cod, a = new Map()); for (const [s, days] of stores) { let b = a.get(s); if (!b) a.set(s, b = new Map()); for (const [d, v] of days) b.set(d, v); } }   // la misma celda en dos archivos: vale la del último
    for (const [cd, o] of q.ignored) { const x = ignored.get(cd) || { n: 0, q: 0, nombre: o.nombre || '' }; x.n += o.n; x.q += o.q || 0; if (!x.nombre) x.nombre = o.nombre || ''; ignored.set(cd, x); }
    for (const [d, k] of q.dayTot) dayTot.set(d, (dayTot.get(d) || 0) + k);
    minD = Math.min(minD, q.minD); maxD = Math.max(maxD, q.maxD); n += q.n; bad += q.bad || 0; truncado = truncado || !!q.truncado; matriz = matriz || !!q.matriz; (q.familias || []).forEach(f => fams.add(f));
  }
  return { agg, ignored, dayTot, minD, maxD, n, bad, truncado, matriz, familias: [...fams], rangosNuevos: unirRangos(list.map(q => [q.minD, q.maxD])) };
}
function resumenParte(x) {
  let unidades = 0; const sucs = new Set();
  for (const [, st] of x.parsed.agg) for (const [s, days] of st) { sucs.add(s); for (const q of days.values()) unidades += q; }
  return { file: x.file, minD: x.parsed.minD, maxD: x.parsed.maxD, n: x.parsed.n, productos: x.parsed.agg.size, sucursales: sucs.size, unidades: Math.round(unidades), ignorados: x.parsed.ignored.size, matriz: !!x.parsed.matriz };
}
function armarPendiente() {
  if (!PEND.cola.length) { PEND.ventas = null; renderPending(); return; }
  const p = planSalesImport(mergeParsed(PEND.cola.map(x => x.parsed)));
  p.partes = PEND.cola.map(resumenParte);
  p.file = PEND.cola.length === 1 ? PEND.cola[0].file : PEND.cola.length + ' archivos';
  p.ciDesdePedidos = Math.max(0, ...PEND.cola.map(x => x.desdePedidos || 0));
  PEND.ventas = p; renderPending();
}
async function agregarArchivoVentas(rows, nombre) {
  if (!S.master.length) throw new Error('Primero cargá la base de productos.');
  let parsed, desdePedidos = 0;
  try { parsed = parseSales(rows); }
  catch (e) {
    if (!e.sinMatch) throw e;
    desdePedidos = await completarCodigosInternos();            // reintenta una vez con el cruce armado desde los pedidos
    if (!desdePedidos) throw e;
    parsed = parseSales(rows);
  }
  const clave = nombre + '|' + parsed.n + '|' + parsed.minD + '|' + parsed.maxD;
  PEND.cola = PEND.cola.filter(x => x.clave !== clave);          // el mismo archivo elegido dos veces queda una sola vez
  PEND.cola.push({ clave, file: nombre, parsed, desdePedidos });
  armarPendiente();
}

/* ================= Análisis del pronóstico: todos los números ================= */
const ANA = { cv: 0.6, out: 2, pend: 0.02, r2: 0.4, nivel: 0.35, eLo: 0.75, eHi: 1.4 };
const wkDn = i => S.start + 7 * i;
function grpSeas(grupo, t) {
  const g = S.params.g, ser = groupSer(grupo), LY = t - 52, cl = isPartial() ? S.lastIdx - 1 : S.lastIdx;
  const o = { f: 1, R: null, num: null, den: null, why: '' };
  if (g.estac <= 0) { o.why = 'estacionalidad desactivada'; return o; }
  if (LY < S.vf || LY > cl) { o.why = 'sin datos del año pasado'; return o; }
  let num = 0, cnt = 0; for (let j = LY - 1; j <= LY + 1; j++) if (j >= S.vf && j <= cl) { num += ser[j]; cnt++; }
  num /= cnt;
  let den = 0, sw = 0; const n = Math.min(g.N, cl - S.vf + 1);
  for (let k = 0; k < n; k++) { const i = cl - n + 1 + k, j = i - 52, w = g.pesos === 'lineal' ? k + 1 : 1; if (j < S.vf) { o.why = 'faltan datos del año pasado'; return o; } den += w * ser[j]; sw += w; }
  den /= sw; if (!(den > 0) || !(num > 0)) { o.why = 'ventas nulas'; return o; }
  o.num = num; o.den = den; o.R = num / den; o.f = clamp(1 + g.estac * (o.R - 1), g.estacMin, g.estacMax); o.why = 'ok'; return o;
}
function anaMetrics(r) {
  const P = r.P, cod = r.m.cod, fl = [], reg = P.reg, nW = P.wIdx.length;
  const sf = []; for (let k = 1; k <= 4; k++) sf.push(seasFactor(cod, S.lastIdx + k));
  const lvl = P.m13 > 0 ? P.L / P.m13 - 1 : 0;
  if (P.L <= 0 && P.sum8 <= 0) fl.push(['Sin ventas', 'crit', 'Sin ventas en las últimas 8 semanas.']);
  else {
    if (P.newish) fl.push(['Poca historia', 'warn', 'Menos de 8 semanas de datos: el pronóstico es poco confiable.']);

<b>4. Estacionalidad</b>  modo ${mode === 'grupo' ? 'grupo “' + esc(m.grupo) + '”' : mode === 'producto' ? 'propia del producto' : 'ninguna'}, intensidad ${nf(g.estac * 100)}%.
     R = (ventas de la serie en la misma semana del año pasado, promedio de 3 semanas) ÷ (ventas de la serie en las semanas del nivel, un año atrás, con los mismos pesos)
     índice = 1 + intensidad × (R − 1), acotado a ${g.estacMin}–${g.estacMax}.

<b>5. Pronóstico</b>  semana = nivel × índice estacional × tendencia × factor manual (${nf(fmOf(ov), 2)}); cada día = semana × peso de ese día de la semana.</div>
    <h3 style="margin-top:18px">Historia semana por semana</h3>

  const apply = () => {

/* ================= Firebase: stock, catálogo y reglas ================= */
const FBC = { prods: null, at: null };
function rulesNote(e) {
  const code = (e && (e.code || e.message)) || '';
  return `<div class="note crit"><b>No se pudo leer o guardar en Firebase</b> (${esc(code)}).<br>Tus reglas de Firestore tienen que permitir la colección <code>comprasConfig</code>. En Firebase → Firestore → Reglas, agregá dentro de <code>match /databases/{database}/documents</code>:<pre style="margin:8px 0;white-space:pre-wrap">match /comprasConfig/{doc} {\n  allow read, write: if true;\n}</pre>Publicá las reglas y recargá esta página. (Es la misma apertura que ya usa tu app de armado; si más adelante sumás login, esta colección se protege igual.)</div>`;
}
let saveMT = null;
function saveMasterSoon() { clearTimeout(saveMT); saveMT = setTimeout(() => saveMaster().catch(e => toast('No se pudo guardar el catálogo: ' + (e.message || e.code))), 700); }
const fbTime = () => FBC.at ? new Date(FBC.at).toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' }) : '';

/* ---- Catálogo, proveedores, unidades por caja y stock: se leen solos de Firebase (productos, bultos) ---- */
const CAMPOS_MASTER = ['nombre', 'prov', 'uni', 'xcaja', 'ucaja', 'kgu', 'vida', 'grupo', 'nota'];
function masterBase(prods) {
  const base = {};
  prods.forEach(p => {
    const cod = normCod(p.cod), prov = String(p.prov || '').trim().toUpperCase();
    if (!cod || !prov) return; // sin proveedor no se puede planificar una compra
    base[cod] = { cod, ci: normCod(p.ci), nombre: p.nombre || cod, prov, uni: 'UNI', xcaja: !!p.ucaja, ucaja: p.ucaja || null, kgu: null, vida: '', grupo: defaultGroup(prov, cod), nota: '' };
  });
  return base;
}
// Lo que se corrigió a mano (catálogo editable, planilla opcional) manda sobre lo que viene de Firebase.
function mezclarMaster(base, guardados) {
  const ov = {}; (guardados || []).forEach(x => { if (x && x.cod) ov[x.cod] = x; });
  const out = Object.values(base).map(b => { const o = ov[b.cod]; return o ? { ...b, ...o, ucaja: o.ucaja || b.ucaja, xcaja: !!(o.xcaja || b.xcaja) } : { ...b }; });
  (guardados || []).forEach(x => { if (x && x.cod && !base[x.cod]) out.push({ ...x }); }); // cargados a mano o que ya no figuran con proveedor
  return out;
}
function sameAsBase(m) {
  const b = S.base && S.base[m.cod]; if (!b) return false;
  return CAMPOS_MASTER.every(k => (m[k] === undefined ? null : m[k]) === (b[k] === undefined ? null : b[k]));
}
function stockDe(prods) {
  const by = {}; prods.forEach(p => by[normCod(p.cod)] = p);
  const rows = []; S.master.forEach(m => { const p = by[m.cod]; if (p) rows.push({ cod: m.cod, prov: m.prov, qty: p.stock, unit: 'unidades' }); });
  return { date: dnToStr(todayDn()), file: 'Firebase · stock del depósito', rows };
}
function metaVirtual() {
  const hoy = todayDn(), ini = hoy - dowOf(hoy) - 7 * 12;
  return { startWeek: dnToStr(ini), validFrom: dnToStr(ini), lastDate: dnToStr(hoy - 1), updatedAt: dnToStr(hoy), virtual: true };
}

async function fbSyncStock(quiet) {
  try {
    const prods = await S.fb.loadCatalogo(!quiet); FBC.prods = prods; FBC.at = Date.now();
    S.base = masterBase(prods); S.master = mezclarMaster(S.base, S.master);
    S.master.forEach(m => { if (!S.dd[m.cod]) S.dd[m.cod] = {}; if (!S.params.prov[m.prov]) S.params.prov[m.prov] = { ...DEFAULT_PROV }; });
    S.stock = stockDe(prods);
    if (S.meta) { setup(); invalidate(); }
    aplicarLeadTimesEstimados();
    if (!quiet) toast(`Stock actualizado: ${nf(S.stock.rows.length)} productos del depósito.`, 4000);
    render(false);
  } catch (e) { toast('No se pudo leer el stock de Firebase: ' + (e.message || e.code || e), 7000); }
}

function fbCardHtml() {
  const provs = new Set(S.master.map(m => m.prov)).size;
  return `<div class="card"><h3>2. Catálogo y stock · conectados</h3>
    <div class="muted small" style="margin:6px 0 12px">Los <b>productos</b>, los <b>proveedores</b> y el <b>stock</b> se leen solos del depósito (Firebase). Las unidades por caja salen del conteo. No hay nada que cargar a mano.</div>
    <div class="stats s"><div class="stat"><div class="v">${nf(S.master.length)}</div><div class="l">productos con proveedor</div></div><div class="stat"><div class="v">${nf(provs)}</div><div class="l">proveedores</div></div></div>
    <div class="bar" style="margin-top:12px"><button class="btn" id="fbStock">Actualizar stock ahora</button><span class="muted small">${FBC.at ? 'Última lectura a las ' + fbTime() + '.' : ''}</span></div></div>`;
}
function fbBind() {
  const b = $('#fbStock'); if (b) b.onclick = async () => { b.disabled = true; await fbSyncStock(false); };
}

/* ================= Catálogo editable ================= */
function viewCat(main) {
  const u = S.ui; u.cq = u.cq || ''; u.cprov = u.cprov || ''; u.cmax = u.cmax || 120;
  const provs = [...new Set(S.master.map(m => m.prov))].sort(), q = u.cq.trim().toLowerCase();
  const list = S.master.filter(m => (!u.cprov || m.prov === u.cprov) && (!q || m.cod.toLowerCase().includes(q) || m.nombre.toLowerCase().includes(q))).sort((a, b) => a.prov.localeCompare(b.prov) || a.nombre.localeCompare(b.nombre));
  const act = m => (S.params.prod[m.cod] || {}).activo !== false, shown = list.slice(0, u.cmax), sinCaja = S.master.filter(m => !m.ucaja).length;
  main.innerHTML = `<section>${heroHead('Catálogo', 'Productos de esta familia', 'Cada producto con su proveedor, cómo se compra y cuántas unidades trae la caja. Tocá un valor para editarlo; se guarda solo.')}</section>
  ${S.master.length ? '' : '<div class="note warn"><b>El catálogo está vacío.</b> Andá a <b>Datos</b> y traé los productos desde Firebase.</div>'}
  ${sinCaja && S.master.length ? `<div class="note"><b>${sinCaja}</b> productos sin “unidades por caja”: se planifican en unidades sueltas. Si el proveedor vende por caja, tildá “Por caja” y completá las unidades.</div>` : ''}
  <datalist id="dlProv">${provs.map(p => `<option value="${esc(p)}">`).join('')}</datalist>
  <div class="card"><div class="bar"><div class="fld"><label for="cQ">Buscar</label><input type="text" id="cQ" value="${esc(u.cq)}" placeholder="código o nombre"></div>
    <div class="fld"><label for="cP">Proveedor</label><select id="cP"><option value="">Todos</option>${provs.map(p => `<option ${p === u.cprov ? 'selected' : ''}>${esc(p)}</option>`).join('')}</select></div>
    <button class="btn sm" id="cOn">Activar los ${list.length} filtrados</button><button class="btn sm" id="cOff">Desactivar los ${list.length} filtrados</button></div>
  <div class="tw" style="margin-top:12px;max-height:70vh"><table><thead><tr><th title="Si está desactivado no entra en la orden de compra">Activo</th><th>Código</th><th>Producto</th><th title="Proveedor al que se le compra">Proveedor</th><th title="Grupo que comparte el índice de estacionalidad">Grupo</th><th title="Se compra y se envía por caja">Por caja</th><th class="r" title="Unidades de venta que trae una caja">Un./caja</th><th title="Unidad en la que se exportan las ventas">Unidad</th><th class="r" title="Kilos por unidad (solo si vendés por kg)">Kg/un.</th></tr></thead><tbody>${shown.map(m => `<tr data-c="${esc(m.cod)}"><td><input type="checkbox" data-f="activo" ${act(m) ? 'checked' : ''}></td><td>${esc(m.cod)}</td><td class="wrap">${esc(m.nombre)}</td><td><input type="text" data-f="prov" list="dlProv" value="${esc(m.prov)}" style="width:150px"></td><td><input type="text" data-f="grupo" value="${esc(m.grupo || '')}" style="width:130px"></td><td><input type="checkbox" data-f="xcaja" ${m.xcaja ? 'checked' : ''}></td><td class="r"><input type="number" min="0" step="any" data-f="ucaja" value="${m.ucaja ?? ''}" style="width:70px"></td><td><select data-f="uni"><option ${m.uni === 'UNI' ? 'selected' : ''}>UNI</option><option ${m.uni === 'KG' ? 'selected' : ''}>KG</option></select></td><td class="r"><input type="number" min="0" step="any" data-f="kgu" value="${m.kgu ?? ''}" style="width:70px"></td></tr>`).join('')}</tbody></table></div>
  ${list.length > shown.length ? `<div class="bar" style="margin-top:10px"><span class="muted small">Mostrando ${shown.length} de ${list.length}.</span><button class="btn sm" id="cMore">Mostrar 120 más</button></div>` : ''}</div>`;
  $('#cQ').oninput = e => { u.cq = e.target.value; u.cmax = 120; clearTimeout(viewCat._t); viewCat._t = setTimeout(() => { viewCat(main); const i = $('#cQ'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }, 250); };
  $('#cP').onchange = e => { u.cprov = e.target.value; u.cmax = 120; viewCat(main); };
  const more = $('#cMore'); if (more) more.onclick = () => { u.cmax += 120; viewCat(main); };
  const setAct = v => { list.forEach(m => { (S.params.prod[m.cod] = S.params.prod[m.cod] || {}).activo = v; }); invalidate(); saveParams(); viewCat(main); toast((v ? 'Activados ' : 'Desactivados ') + list.length + ' productos.'); };
  $('#cOn').onclick = () => setAct(true); $('#cOff').onclick = () => setAct(false);
  $$('tr[data-c]', main).forEach(tr => $$('[data-f]', tr).forEach(inp => inp.onchange = () => {
    const m = S.mm[tr.dataset.c], f = inp.dataset.f; if (!m) return;
    if (f === 'activo') { (S.params.prod[m.cod] = S.params.prod[m.cod] || {}).activo = inp.checked; invalidate(); saveParams(); return; }
    if (f === 'xcaja') m.xcaja = inp.checked;
    else if (f === 'ucaja' || f === 'kgu') { const v = inp.value === '' ? null : Math.max(0, +inp.value); m[f] = v || null; if (f === 'ucaja' && v) { m.xcaja = true; $('[data-f=xcaja]', tr).checked = true; } }
    else if (f === 'uni') m.uni = inp.value;
    else { m[f] = inp.value.trim() || (f === 'prov' ? 'SIN PROVEEDOR' : ''); if (f === 'prov') { if (!S.params.prov[m.prov]) S.params.prov[m.prov] = { ...DEFAULT_PROV }; if (!m.grupo || m.grupo === tr.dataset.old) m.grupo = m.prov; saveParams(); } }
    invalidate(); if (S.meta && (f === 'prov' || f === 'grupo')) setup(); if (S.meta) buildStock();
    saveMasterSoon(); if (f === 'prov') viewCat(main);
  }));
}

<script type="module">
const firebaseConfig = {
      apiKey: "AIzaSyBjsx_gcl2X1yr8SPoi_tF3qGcrFRLK3bQ",

      messagingSenderId: "713677759926",
      appId: "1:713677759926:web:e0a8f512d79f75f2a5cd17"
    };
try {
  const V = "https://www.gstatic.com/firebasejs/10.13.0/";
  const { initializeApp } = await import(V + "firebase-app.js");
  const { getFirestore, doc, getDoc, setDoc, deleteDoc, collection, getDocs, query, where, limit, serverTimestamp, writeBatch } = await import(V + "firebase-firestore.js");
  const fs = getFirestore(initializeApp(firebaseConfig)), COL = 'comprasConfig', idOf = p => p.replace(/\//g, '__');
  const db = {
    doc: path => ({
      get: async () => { const d = await getDoc(doc(fs, COL, idOf(path))); return { exists: d.exists(), data: () => d.data() }; },
      set: async v => { const c = JSON.parse(JSON.stringify(v)); c._col = path.split('/')[0]; await setDoc(doc(fs, COL, idOf(path)), c); },
      delete: async () => deleteDoc(doc(fs, COL, idOf(path)))
    }),
    deleteIds: async (ids, onp) => { const N = 400; for (let i = 0; i < ids.length; i += N) { const b = writeBatch(fs); ids.slice(i, i + N).forEach(id => b.delete(doc(fs, COL, id))); await b.commit(); onp && onp(Math.min(ids.length, i + N) / ids.length); } },
    // varios documentos de una sola vez: lotes de 100 (el límite de Firebase es 500 por lote)
    setMany: async (items, onp) => { const N = 100; for (let i = 0; i < items.length; i += N) { const b = writeBatch(fs); items.slice(i, i + N).forEach(([path, v]) => { const c = JSON.parse(JSON.stringify(v)); c._col = path.split('/')[0]; b.set(doc(fs, COL, idOf(path)), c); }); await b.commit(); onp && onp(Math.min(items.length, i + N) / items.length); } },
    collection: name => ({ get: async () => { const s = await getDocs(query(collection(fs, COL), where('_col', '==', name))); return { docs: s.docs.map(d => ({ id: d.id, data: () => d.data() })) }; } })
  };
  // Quién está usando el módulo y con qué perfil: se toma la sesión del Armador y se leen sus perfiles (permisos.js)
  const { resolverPermisos, cargarUsuario, leerSesionGuardada, NOMBRE_ROL, PERFILES } = await import('./permisos.js');
  let acceso = { ok: false, motivo: 'sin_sesion' };
  const ses = leerSesionGuardada();
  if (ses) {
    const r = await cargarUsuario({ db: fs, doc, getDoc, setDoc, serverTimestamp }, ses.documento);
    if (r.ok) {
      // el perfil con el que entró al Armador; si no vino (sesión vieja), el primero que le sirva para Compras
      const perfil = [ses.perfil, ...PERFILES].find(p => p && resolverPermisos(r.usuario, p) && (p === ses.perfil || resolverPermisos(r.usuario, p).has('compras_ver')));
      const perm = perfil ? resolverPermisos(r.usuario, perfil) : null;
      acceso = (perm && perm.has('compras_ver')) ? { ok: true, dni: ses.documento, nombre: r.usuario.nombre, perfil, perfilNombre: NOMBRE_ROL[perfil], aprobar: perm.has('compras_aprobar') } : { ok: false, motivo: 'sin_permiso', nombre: r.usuario.nombre };
    }
  }
  window.__acceso = acceso;

  // para no volver a leer miles de productos cada vez que se abre la pantalla; "Actualizar stock ahora" fuerza la lectura.
  const CLAVE_CAT = 'compras_catalogo_v3', VIDA_CAT = 10 * 60 * 1000;
  const loadCatalogo = async (forzar) => {
    try { const c = JSON.parse(sessionStorage.getItem(CLAVE_CAT) || 'null'); if (!forzar && c && Date.now() - c.t < VIDA_CAT) return c.d; } catch (e) { /* sin caché */ }
    const [sp, sb] = await Promise.all([getDocs(collection(fs, 'productos')), getDocs(collection(fs, 'bultos'))]);
    const caja = {}; sb.docs.forEach(d => { const x = d.data(), base = String(x.codigoBase || '').trim(), u = Number(x.unidadesPorBulto); if (base && u > 0) caja[base] = u; });
    const d = sp.docs.map(x => { const v = x.data(), u = Number(v.unidadesPorBulto); return { cod: x.id, nombre: v.producto || '', stock: Number(v.stockTotal) || 0, prov: v.proveedor || '', ci: String(v.codigoInterno ?? '').trim(), pos: String(v.posicionPrincipal ?? '').trim(), ucaja: u > 0 ? u : (caja[x.id] || null) }; });
    try { sessionStorage.setItem(CLAVE_CAT, JSON.stringify({ t: Date.now(), d })); } catch (e) { /* si no entra, igual funciona */ }
    return d;
  };
  window.__fbOk({
    db, loadCatalogo,
    ping: async () => { await setDoc(doc(fs, COL, '_ping'), { t: Date.now() }); await getDoc(doc(fs, COL, '_ping')); },
    loadProductos: async () => { const s = await getDocs(collection(fs, 'productos')); return s.docs.map(d => { const x = d.data(); return { cod: d.id, nombre: x.producto || '', stock: Number(x.stockTotal) || 0, prov: x.proveedor || '', ci: String(x.codigoInterno ?? '').trim() }; }); },

    // código interno -> código de barras, de los pedidos: sirve cuando los productos de Firebase no traen el código interno
    loadCiMap: async () => { const s = await getDocs(query(collection(fs, 'pedidos'), limit(5000))), m = {}, n = v => String(v ?? '').trim().replace(/\.0+$/, '').replace(/^0+(?=\d)/, ''); s.docs.forEach(d => { const x = d.data(), ci = n(x.codigoInterno), cb = n(x.codigo); if (ci && cb && !m[ci]) m[ci] = cb; }); return m; }
  });
